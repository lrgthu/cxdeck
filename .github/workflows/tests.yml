name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gui_e2e:
        description: Run real iTerm2 GUI acceptance (requires macOS Automation permission)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terminal prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh build-essential
          curl -fL https://github.com/neurosnap/zmx/releases/download/v0.8.1/zmx-0.8.1-linux-x86_64.tar.gz -o /tmp/zmx.tar.gz
          echo 'dfd75720b942466f28870731cc86dbc07afa72fb8f3bd5eeb4ff707e4eecebe8  /tmp/zmx.tar.gz' | sha256sum -c -
          tar -xzf /tmp/zmx.tar.gz -C /tmp
          sudo install -m 0755 /tmp/zmx /usr/local/bin/zmx
      - name: Install terminal prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v zmx >/dev/null || brew install neurosnap/tap/zmx
      - name: Versions and syntax
        run: |
          python3 --version
          zmx version
          zsh --version
          cc --version
          git --version
          zsh -n cxdeck.zsh
          zsh -n install.sh
          zsh -n uninstall.sh
          zsh -n tests/prepare_ci_iterm.zsh
          python3 -m compileall -q agent_console.py console_entry.py codex_resume.py cx_paths.py cx_store.py cx_iterm.py cx_version.py cx_zmx.py cx_upgrade.py workbench.py install.py tests tools
      - name: Unit and disposable real-backend tests (no real Codex API calls)
        run: python3 -m unittest discover -s tests -v
      - name: Install and register iTerm2 scripting dictionary (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list --cask iterm2 >/dev/null 2>&1 || brew install --cask iterm2
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/iTerm.app/Contents/Info.plist
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/iTerm.app
      - name: Compile the iTerm2 bridge (not GUI execution)
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import cx_iterm,os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"],"cx-iterm.applescript").write_text(cx_iterm.APPLESCRIPT)'
          osacompile -o "$RUNNER_TEMP/cx-iterm.scpt" "$RUNNER_TEMP/cx-iterm.applescript"
      - name: Verify official test app and prepare unattended first launch
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.gui_e2e
        run: zsh tests/prepare_ci_iterm.zsh
      - name: Real iTerm2 GUI E2E (explicit opt-in; no real Codex)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.gui_e2e
        timeout-minutes: 3
        run: python3 tests/iterm_e2e.py
